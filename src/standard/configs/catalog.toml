# Library register (R9). Every entry has a `purpose` (one short area); one problem = one library.
# A dependency missing from this register is an R9 error. Adding a library = a commit to this file with its purpose
# (no owner decision needed). A second library with the same purpose within a language needs
# `duplicate_of_ok = "<reason>"`, otherwise the standard's own test fails.
# Names are normalized (lowercase, "-" for "_" and "."); a trailing "*" is a prefix wildcard.

[python.runtime]
fastapi = { purpose = "web framework" }
uvicorn = { purpose = "asgi server" }
pydantic = { purpose = "data validation" }
sqlalchemy = { purpose = "orm" }
psycopg = { purpose = "postgres driver" }
alembic = { purpose = "db migrations" }
structlog = { purpose = "logging" }
httpx2 = { purpose = "http client" }
apscheduler = { purpose = "scheduler" }
jinja2 = { purpose = "templates" }
markdown-it-py = { purpose = "markdown" }
pyyaml = { purpose = "yaml" }  # always yaml.safe_load
google-api-python-client = { purpose = "google api" }
google-auth = { purpose = "google api", duplicate_of_ok = "credentials companion of google-api-python-client" }
openpyxl = { purpose = "xlsx" }
pillow = { purpose = "images" }

[python.dev]
pytest = { purpose = "tests" }
pytest-asyncio = { purpose = "async tests" }
mypy = { purpose = "type check" }
ruff = { purpose = "lint and format" }
"types-*" = { purpose = "type stubs" }

# SvelteKit, adapter-static, vite plugins and Tailwind are built at build time: dev-only.
[npm.runtime]
svelte = { purpose = "ui framework" }

[npm.dev]
"@eslint/js" = { purpose = "lint" }
"@playwright/test" = { purpose = "e2e tests" }
"@sveltejs/adapter-static" = { purpose = "static build" }
"@sveltejs/kit" = { purpose = "app framework" }
"@sveltejs/vite-plugin-svelte" = { purpose = "svelte build" }
"@tailwindcss/vite" = { purpose = "css build" }
eslint = { purpose = "lint", duplicate_of_ok = "the engine that runs @eslint/js rules" }
eslint-plugin-svelte = { purpose = "lint", duplicate_of_ok = "svelte rules for eslint" }
globals = { purpose = "lint globals" }
svelte-check = { purpose = "svelte type check" }
tailwindcss = { purpose = "css" }
typescript = { purpose = "typescript" }
typescript-eslint = { purpose = "lint", duplicate_of_ok = "typescript rules for eslint" }
vite = { purpose = "bundler" }
vitest = { purpose = "unit tests" }

# CI scanners (component security testing, ADR 0001): images pinned by digest in templates/woodpecker-security-step.yaml.
[ci.tools]
osv-scanner = { purpose = "dependency vulnerabilities", version = "v2.7.1", covers = "uv.lock, requirements.txt, package-lock.json, pnpm-lock.yaml" }
gitleaks = { purpose = "secret scan", version = "v8.30.1", covers = "working tree and git history" }
trivy = { purpose = "image scan", version = "0.76.2", covers = "base images of Dockerfile FROM lines (repos that build an image)" }
