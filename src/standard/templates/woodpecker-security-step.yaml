# Woodpecker security steps (component security testing): known vulnerabilities in dependencies, leaked secrets and,
# for repos that build an image, vulnerable base images. One tool per purpose (ADR 0001, catalog.toml [ci.tools]):
#   osv-scanner  uv.lock, requirements*.txt, package-lock.json, pnpm-lock.yaml (all ecosystems, one database)
#   gitleaks     secrets in the working tree and the whole git history
#   trivy        base images named in Dockerfile FROM lines (only repos that build an image)
# Every scanner only writes a report to .security/; `standard security-gate` decides (the same rules for all tools):
# fail on HIGH/CRITICAL (CVSS >= 7) with a fixed version available, on any leaked secret, on an invalid or expired entry
# in security-ignore.toml. Ignoring needs that reviewed file in the repo:
#   [[ignore]]
#   id = "GHSA-xxxx-xxxx-xxxx"        # advisory id / alias (CVE-...), or the gitleaks Fingerprint for a secret
#   reason = "why it is safe or not reachable"
#   expires = "2027-02-28"            # YYYY-MM-DD, the finding comes back after it
# When it runs: dependency + image scans on pull_request/push that change a lockfile, a Dockerfile or the ignore file,
# and always on cron and manual. On any other push the step starts, sees from CI_PIPELINE_FILES that nothing relevant
# changed and exits 0 in about a second (digest-pinned images stay cached on the agent); the push/deploy step is never
# blocked. gitleaks and the gate are seconds and run on every pipeline. (Woodpecker `when: path:` cannot be used: a step
# that depends on a filtered-out step is a compile error, and the gate must depend on the scanners. Never use the braced shell form of a variable
# in a step: Woodpecker substitutes it while compiling the file; plain $VAR is left to the shell.)
# Paste into the repo's .woodpecker.yaml:
#   - the `variables:` anchors and the `steps:` below; STANDARD_REF is the same sha as in the `standard` step;
#   - add `security-gate` to `depends_on` of the build/push steps (a skipped gate does not block them);
#   - the workflow `when:` must include `cron` (event: [push, pull_request, manual, cron]); steps that must not run
#     nightly (push to the registry, deploy) keep their own `when: event: [push, manual]`;
#   - create the schedule once:  POST /api/repos/<id>/cron  {"name": "nightly-full", "branch": "master",
#     "schedule": "@daily"}  (Woodpecker UI: Repo > Settings > Cron);
#   - repos WITHOUT an image: delete the `security-image` step and its `depends_on` entry.
# Pins: images by digest (bump tag and digest together; `docker buildx imagetools inspect <image:tag>` shows the digest).
variables:
  - &osv_image ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde
  - &gitleaks_image ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  - &trivy_image ghcr.io/aquasecurity/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  # Sourced at the top of the dependency and image scans: exit 0 on a push/PR that changed no lockfile / Dockerfile.
  - &skip_unless_relevant |
    case "$CI_PIPELINE_EVENT" in
      push|pull_request)
        if [ -n "$CI_PIPELINE_FILES" ] && ! printf %s "$CI_PIPELINE_FILES" | grep -Eq '(uv\.lock|requirements[^"/]*\.txt|package-lock\.json|pnpm-lock\.yaml|Dockerfile[^"/]*|security-ignore\.toml)"'; then
          echo "security scan skipped: no lockfile, Dockerfile or security-ignore.toml changed"
          exit 0
        fi ;;
    esac

steps:
  - name: security-deps
    image: *osv_image
    depends_on: []
    commands:
      - *skip_unless_relevant
      - mkdir -p .security
      # exit 1 = vulnerabilities found (the gate judges them); anything above is a scanner failure
      - /osv-scanner scan source -r --allow-no-lockfiles --x-exclude node_modules --x-exclude .venv --format json --output-file .security/osv.json . || [ $? -eq 1 ]

  - name: security-secrets
    image: *gitleaks_image
    depends_on: []
    commands:
      - mkdir -p .security
      - git config --global --add safe.directory "$PWD"
      - gitleaks git . --no-banner --redact --exit-code 0 --report-format json --report-path .security/gitleaks.json

  # Only repos that build an image: base images of the Dockerfile FROM lines (fixable HIGH/CRITICAL only).
  - name: security-image
    image: *trivy_image
    depends_on: []
    commands:
      - *skip_unless_relevant
      - mkdir -p .security
      - |
        set -eu
        n=0
        for dockerfile in $(find . -name 'Dockerfile*' -not -path './node_modules/*' -not -path './.git/*'); do
          for image in $(awk 'tolower($1)=="from"{for(i=2;i<=NF;i++) if($i !~ /^--/){print $i; break}}' "$dockerfile" | sort -u); do
            [ "$image" = scratch ] && continue
            n=$((n+1))
            trivy image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --quiet --format json --output ".security/trivy-$n.json" "$image"
          done
        done

  - name: security-gate
    image: ghcr.io/astral-sh/uv:0.13.6-trixie@sha256:f09daa206efebee043d8e39ce5d71af377600e596fd22d504f7542a0886edc65
    depends_on: [security-deps, security-secrets, security-image]
    environment:
      STANDARD_REF: 0000000000000000000000000000000000000000   # same sha as the `standard` step
    commands:
      - uvx --python 3.15 --from "git+https://github.com/PioxolotlHermes/standard@$STANDARD_REF" standard security-gate
