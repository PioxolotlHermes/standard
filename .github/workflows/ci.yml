# Tests + lint of the standard repo itself. (Replaced by the reusable workflow self-check in group 3.)
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: pytest, ruff, mypy, self-check
        run: |
          set -euo pipefail
          python3 -m pip install --user --disable-pip-version-check "uv==0.13.6"
          export PATH="$HOME/.local/bin:$PATH"
          uv sync --frozen
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run standard check
